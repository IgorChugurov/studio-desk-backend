name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # Throwaway passwords: the test database lives only for this run.
    env:
      APP_ENV: test
      PORT: '3000'
      DB_HOST: localhost
      DB_PORT: '5432'
      DB_NAME: studio_desk
      DB_OWNER_PASSWORD: ci-owner
      DB_PLATFORM_API_PASSWORD: ci-platform
      DB_STUDIO_API_PASSWORD: ci-studio
      DB_PUBLIC_API_PASSWORD: ci-public
      POSTGRES_SUPERUSER_PASSWORD: ci-superuser
      RESEND_API_KEY: ci-resend-key
      RESEND_FROM_EMAIL: 'StudioDesk <noreply@axondigital.xyz>'
      PLATFORM_ADMIN_EMAIL: ci-admin@example.com
      ACCESS_TOKEN_SECRET: ci-access-token-secret-32chars-min
      FILE_STORAGE_DIR: storage
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Start PostgreSQL (same compose file and init script as locally)
        run: pnpm db:up

      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm test:e2e
      - run: pnpm build

  # See studio-desk-docs/03-architecture/deployment.md.
  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/development'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-development
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/igorchugurov/studio-desk-backend
      DEPLOY_DIR: /opt/studio-desk
    steps:
      - uses: actions/checkout@v7

      - name: Image tag
        run: echo "TAG=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ env.TAG }}
            ${{ env.IMAGE }}:development
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: SSH key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Copy deploy files
        env:
          TARGET: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
        run: |
          scp -i ~/.ssh/deploy_key deploy/docker-compose.yml deploy/deploy.sh "$TARGET:$DEPLOY_DIR/"
          scp -i ~/.ssh/deploy_key docker/postgres/init/01-init.sh "$TARGET:$DEPLOY_DIR/postgres-init/"

      - name: Deploy
        env:
          TARGET: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
        run: ssh -i ~/.ssh/deploy_key "$TARGET" "bash $DEPLOY_DIR/deploy.sh $TAG"
