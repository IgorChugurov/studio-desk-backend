# Server compose file. Lives in /opt/studio-desk/ next to .env and image.env;
# GitHub Actions copies it there on every deploy.
# See studio-desk-docs/03-architecture/deployment.md.
name: studio-desk

x-backend-env: &backend-env
  APP_ENV: ${APP_ENV:?}
  PORT: ${PORT:?}
  DB_HOST: ${DB_HOST:?}
  DB_PORT: ${DB_PORT:?}
  DB_NAME: ${DB_NAME:?}
  DB_OWNER_PASSWORD: ${DB_OWNER_PASSWORD:?}
  DB_PLATFORM_API_PASSWORD: ${DB_PLATFORM_API_PASSWORD:?}
  DB_STUDIO_API_PASSWORD: ${DB_STUDIO_API_PASSWORD:?}
  DB_PUBLIC_API_PASSWORD: ${DB_PUBLIC_API_PASSWORD:?}
  RESEND_API_KEY: ${RESEND_API_KEY:?}
  RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:?}
  PLATFORM_ADMIN_EMAIL: ${PLATFORM_ADMIN_EMAIL:?}
  ACCESS_TOKEN_SECRET: ${ACCESS_TOKEN_SECRET:?}
  CORS_EXTRA_ORIGINS: ${CORS_EXTRA_ORIGINS:-}
  FILE_STORAGE_DIR: ${FILE_STORAGE_DIR:?}

services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?}
      DB_NAME: ${DB_NAME:?}
      DB_OWNER_PASSWORD: ${DB_OWNER_PASSWORD:?}
      DB_PLATFORM_API_PASSWORD: ${DB_PLATFORM_API_PASSWORD:?}
      DB_STUDIO_API_PASSWORD: ${DB_STUDIO_API_PASSWORD:?}
      DB_PUBLIC_API_PASSWORD: ${DB_PUBLIC_API_PASSWORD:?}
      CREATE_TEST_DB: 'false'
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U postgres -d "$$DB_NAME"']
      interval: 2s
      timeout: 3s
      retries: 30

  backend:
    image: ghcr.io/igorchugurov/studio-desk-backend:${IMAGE_TAG:?}
    restart: unless-stopped
    environment: *backend-env
    ports:
      - '127.0.0.1:3100:3000'
    volumes:
      - /opt/studio-desk/files:/files
    depends_on:
      postgres:
        condition: service_healthy

  migrate:
    image: ghcr.io/igorchugurov/studio-desk-backend:${IMAGE_TAG:?}
    profiles: ['tools']
    environment: *backend-env
    command: ['node', 'dist/database/migrate.js']
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
