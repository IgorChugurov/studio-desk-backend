name: studio-desk

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?set in .env}
      DB_NAME: ${DB_NAME:?set in .env}
      DB_OWNER_PASSWORD: ${DB_OWNER_PASSWORD:?set in .env}
      DB_PLATFORM_API_PASSWORD: ${DB_PLATFORM_API_PASSWORD:?set in .env}
      DB_STUDIO_API_PASSWORD: ${DB_STUDIO_API_PASSWORD:?set in .env}
      DB_PUBLIC_API_PASSWORD: ${DB_PUBLIC_API_PASSWORD:?set in .env}
    ports:
      - '${DB_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # TCP check: the temporary server used during init scripts listens on
      # the socket only, so this turns healthy only after init has finished.
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U postgres -d "$$DB_NAME"']
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  postgres-data:
